[workspace]
resolver = "2"
members = [
    "crates/wbw-types",
    "crates/wbw-core",
    "crates/wbw-dict",
    "crates/wbw-matcher",
    "crates/wbw-rank",
    "crates/wbw-ngram",
    "crates/wbw-imekit",
    "crates/wbw-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your@email.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fst = "0.4"
memmap2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
phf = { version = "0.11", features = ["macros"] }
lru = "0.12"
anyhow = "1.0"
thiserror = "1.0"
imekit = "0.1"
inputx-ngram = "0.1"
criterion = "0.5"
perfgate = "0.1"